# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This app is a standard Next.js application (no custom server.js — it runs
# via `next start`, which is what `npm run start` invokes). If a Render
# service for this repo was previously created by hand through the dashboard,
# its Start Command may be set to something else (e.g. "node server.js",
# Render's generic Node default) — that produces exactly the error this file
# fixes: "Cannot find module '.../Deployment/app/server.js'", since no such
# file exists in this project.
#
# This file lives in Deployment/, not the repo root. When connecting this
# repo as a Render Blueprint, set the Blueprint's YAML path to
# "Deployment/render.yaml" in the dashboard (Render does not require
# render.yaml to sit at the repo root — you choose its path when the
# Blueprint is created). `rootDir` below is still relative to the repo root,
# not to this file's own location.
#
# To apply this blueprint to an EXISTING service instead: Render dashboard →
# the service → Settings, and set Root Directory / Build Command / Start
# Command to match the values below (Render does not retroactively apply a
# newly-added render.yaml to a service it didn't create).

services:
  - type: web
    name: mike-alemie-website
    runtime: node
    plan: starter
    rootDir: Deployment/app
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mikealemie.com # replace with the real production domain
      - key: ENABLE_HSTS
        value: "false" # flip to "true" only once TLS on the domain is confirmed working

      # ---------------------------------------------------------------------
      # PERSISTENCE — Google Sheets (content) + Google Drive (uploaded images)
      #
      # Render's filesystem is EPHEMERAL: it is wiped on every deploy. The app
      # falls back to local JSON files when these are unset, which is correct
      # for local development but would silently reset all admin content, the
      # admin password, and the visitor count on every single deploy here.
      # These three variables are what make a Render deploy durable.
      #
      # `sync: false` means Render prompts for the value in the dashboard and
      # never stores it in this repo. Set all three under
      #   Service → Environment → Environment Variables.
      #
      # Setup, once:
      #   1. Google Cloud console → new project → enable the Google Sheets API
      #      and the Google Drive API.
      #   2. Create a Service Account, then create a JSON key for it.
      #   3. Create a Google Spreadsheet; its id is the long segment in the URL
      #      between /d/ and /edit.
      #   4. Create a Drive folder for uploads; its id is the last URL segment.
      #   5. Share BOTH the spreadsheet and the folder with the service
      #      account's ...@....iam.gserviceaccount.com address, as Editor.
      #      Skipping this is the single most common failure — Google reports
      #      an unshared resource as "not found", indistinguishable from a typo.
      #   6. Paste the values below. Verify afterwards in the running site at
      #      /admin → System → Storage, which reports the active backend and
      #      runs a live connection test.
      #
      # The app creates one tab per content document on first save; no manual
      # spreadsheet setup is needed.
      # ---------------------------------------------------------------------

      # The whole downloaded service-account key file, pasted as one value.
      # This is a secret: never commit it, and never paste it into chat or a
      # ticket. Rotate the key in Google Cloud if it is ever exposed.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: GOOGLE_SHEET_ID
        sync: false

      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false

      # Powers "Connect Google Drive" in Admin → System → Storage. Separate
      # from GOOGLE_SERVICE_ACCOUNT_JSON on purpose: service accounts have no
      # storage quota on a personal (non-Workspace) Drive, so image uploads
      # need to run as the real account owner via OAuth instead — the service
      # account above stays Sheets-only. From an OAuth 2.0 Client ID
      # (type: Web application) in the same Cloud Console project, with this
      # service's own URL + "/api/admin/google-oauth/callback" registered as
      # an Authorized redirect URI.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

    # PORT is supplied by Render automatically — `next start` reads it, no
    # manual configuration needed.
    #
    # No Render Disk is required: with the variables above, all durable state
    # lives in Google. Development/Implementation/MAWebsiteDB.sql is historical
    # — it targets Microsoft SQL Server, which Render does not offer.
